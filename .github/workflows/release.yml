name: 发布 Windows 安装包

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: 检查版本号
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw '发布标签必须为与 package.json 对应的正式版本号，例如 v0.1.0。'
          }
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: 发布安装包和更新文件
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "dist/Cryptography-Toolbox-Setup-$version.exe"
          $assets = @($installer, "$installer.blockmap", 'dist/latest.yml')
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "缺少发布文件 $asset"
            }
          }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --generate-notes --title "密码工具箱 $env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release 发布失败。' }
